<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងគំរូ</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>តារាងគំរូ</h1>
    <table>
        <tr>
            <th>លេខរៀង</th>
            <th>ឈ្មោះ</th>
            <th>អាយុ</th>
            <th>ទីកន្លែងកំណើត</th>
        </tr>
        <tr>
            <td>1</td>
            <td>សុខា</td>
            <td>25</td>
            <td>ភ្នំពេញ</td>
        </tr>
        <tr>
            <td>2</td>
            <td>សុផា</td>
            <td>30</td>
            <td>សៀមរាប</td>
        </tr>
        <tr>
            <td>3</td>
            <td>ភាសា</td>
            <td>28</td>
            <td>កំពង់ឆ្នាំង</td>
        </tr>
    </table>
</body>
</html>
